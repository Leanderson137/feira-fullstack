<section class="login-page">

  <div class="login-card">

    <div class="brand">

      <div class="brand-icon">
        ◇
      </div>

      <div>
        <h1>Feira</h1>
        <p>Management System</p>
      </div>

    </div>

    <h2>Bem-vindo</h2>

    <p class="subtitle">
      Faça login para acessar o sistema.
    </p>

    <p
      *ngIf="mensagem"
      class="message">

      {{ mensagem }}

    </p>

    <form>

      <div class="field">

        <label>E-mail</label>

        <input
          type="email"
          name="email"
          placeholder="exemplo@email.com"
          [(ngModel)]="email">

      </div>

      <div class="field">

        <label>Senha</label>

        <div class="password-wrapper">

          <input
            [type]="mostrarSenha ? 'text' : 'password'"
            name="senha"
            placeholder="Digite sua senha"
            [(ngModel)]="senha">

          <button
            type="button"
            class="eye-button"
            (click)="alternarSenha()">

            {{ mostrarSenha ? '👁' : '👁️‍🗨️' }}

          </button>

        </div>

      </div>

      <button
        type="button"
        [disabled]="carregando"
        (click)="entrar()">

        {{ carregando ? 'Entrando...' : 'Entrar' }}

      </button>

    </form>

    <p class="cadastro-link">

      Ainda não possui conta?

      <a routerLink="/cadastro">
        Criar conta
      </a>

    </p>

  </div>

</section>
