<section class="page-container">

  <h1>Cadastro de Categorias</h1>

  <section class="card">

    <p class="mensagem">
      {{ mensagem }}
    </p>

    <form>

      <div class="form-group">

        <label>Nome</label>

        <input
          type="text"
          name="nome"
          [(ngModel)]="nome">

      </div>

      <div class="form-group">

        <label>Descrição</label>

        <textarea
          name="descricao"
          [(ngModel)]="descricao">
        </textarea>

      </div>

      <button
        type="button"
        (click)="cadastrar()">

        {{ indiceEdicao === null ? 'Cadastrar' : 'Atualizar' }}

      </button>

      <button
        *ngIf="indiceEdicao !== null"
        type="button"
        (click)="cancelarEdicao()">

        Cancelar edição

      </button>

    </form>

  </section>

  <section class="card">

    <h2>Lista de Categorias</h2>

    <p *ngIf="categorias.length === 0">
      Nenhuma categoria cadastrada.
    </p>

    <table *ngIf="categorias.length > 0">

      <thead>
        <tr>
          <th>Nome</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let categoria of categorias; let i = index">

          <td>{{ categoria.nome }}</td>

          <td>{{ categoria.descricao }}</td>

          <td>

            <button
              type="button"
              (click)="editar(i)">

              Editar

            </button>

            <button
              type="button"
              (click)="excluir(i)">

              Excluir

            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </section>

</section>
